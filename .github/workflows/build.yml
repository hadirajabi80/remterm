name: Build

# macOS apps can only be built on a Mac: this builds Remterm.app (universal) and the
# .dmg on GitHub's macOS runners. On a published release the .dmg is attached to it;
# "Run workflow" builds one to download from the run's artifacts.
# The Windows job runs build.ps1 (Remterm.exe, RemtermRdp.exe and the setup); the
# files are in the run's artifacts, and on a published release the setup is attached.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version shown in the app
        default: dev
      release_tag:
        description: Existing release tag to rebuild and upload (optional)
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Remterm.exe, RemtermRdp.exe + setup
        shell: pwsh
        env:
          BUILD_VERSION: ${{ github.event.release.tag_name || inputs.release_tag || inputs.version }}
        run: |
          $version = $env:BUILD_VERSION.TrimStart('v')
          ./build.ps1 -Installer -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: Remterm-Windows
          path: build/bin/*.exe

      # The in-app updater downloads RemtermSetup-<version>.exe from the release.
      - name: Attach the setup to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" build/bin/RemtermSetup-*.exe --clobber

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Remterm.app + dmg
        env:
          BUILD_VERSION: ${{ github.event.release.tag_name || inputs.release_tag || inputs.version }}
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh "${BUILD_VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: Remterm-macOS
          path: build/macos/*.dmg

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" build/macos/*.dmg --clobber
